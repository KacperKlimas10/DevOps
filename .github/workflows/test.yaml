name: Run Tests (Validation Stage)

on:
  push:
    branches:
      - master
    paths:
      - microservices/**
      - .github/workflows/test.yaml
  pull_request:
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs: 
      microservices: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Changed paths filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # It's only used if action is triggered by a pull request event.
          filters: '.github/utils/path-filters.yaml'

  run-tests:
    runs-on: ubuntu-24.04
    needs: filter
    if: ${{ needs.filter.outputs.microservices != '[]' && needs.filter.outputs.microservices != '' }}
    strategy:
      matrix:
        microservice: ${{ fromJson(needs.filter.outputs.microservices) }}
      fail-fast: false 
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK # For Java microservices
        if: ${{ startsWith(matrix.microservice, 'microservices/java') }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven  # we can speed up our workflow 

      - name: Test with Maven
        if: ${{ startsWith(matrix.microservice, 'microservices/java') }}
        working-directory: ${{ matrix.microservice }}
        run: mvn test  # Using Maven

      - name: Setup Go # For Go microservices
        if: ${{ startsWith(matrix.microservice, 'microservices/go') }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          go-version-file: '${{ matrix.microservice }}/go.mod'
          cache: true
          cache-dependency-path: '${{ matrix.microservice }}/go.sum'

      - name: Test with Go
        if: ${{ startsWith(matrix.microservice, 'microservices/go') }}
        working-directory: ${{ matrix.microservice }}
        run: go test ./tests -v