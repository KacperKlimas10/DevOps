services:

  # MICROSERVICES

  storage-service:
    image: storage-service:v1.0
    build:
      context: ../../microservices/java/storage-service
      dockerfile: Dockerfile
      target: development
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      BUCKET_ENDPOINT: http://minio:9000
      AWS_BUCKET_NAME : devops
    ports:
      - "8080:8080"
    networks:
      - backend-network
      - db-network
#    command: ["--spring.profiles.active=development"]  # Here we override CMD to specify profile arg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 0s
      start_interval: 5s

  user-service:
    image: user-service:v1.0
    build:
      context: ../../microservices/java/user-service
      dockerfile: Dockerfile
      target: development
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      POSTGRESQL_URI: jdbc:postgresql://postgresql/devops
    ports:
      - "8081:8080"
    networks:
      - backend-network
      - db-network
#    command: ["--spring.profiles.active=development"]  # Here we override CMD to specify profile arg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 0s
      start_interval: 5s
  
  go-demo-service:
    image: demo-go:v1.0
    build:
      context: ../../microservices/go/demo-go
      dockerfile: Dockerfile
      target: development
    restart: on-failure
    ports:
      - "8082:8080"
    networks:
      - backend-network
      - db-network
      
  # BROKERS

  rabbitmq:
    image: rabbitmq:management
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: kacper
      RABBITMQ_DEFAULT_PASS: kacper
      RABBITMQ_DEFAULT_VHOST: rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend-network
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq:/etc/rabbitmq

  # DATABASES

  postgresql:
    image: postgres:latest
    restart: on-failure
    environment:
      POSTGRES_USER: kacper
      POSTGRES_PASSWORD: kacper
      POSTGRES_DB: devops
    ports:
      - "5432:5432"
    networks:
      - db-network
    volumes:
      - postgresql:/var/lib/postgresql

  minio:  # I've decided to use Minio, because is compatible with Amazon S3 API using in many production buckets like Cloudlare R2
    image: quay.io/minio/minio:latest
    restart: on-failure
    environment:
      MINIO_ROOT_USER: kacperkacper
      MINIO_ROOT_PASSWORD: kacperkacper
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    networks:
      - db-network
      - monitoring-network
    command: server /data --console-address ":9001"

  ## DATABASE GUI

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: kacper@kacper.pl
      PGADMIN_DEFAULT_PASSWORD: kacper
    ports:
      - "8880:80"
    networks:
      - db-network
    volumes:
      - pgadmin:/var/lib/pgadmin

  # MONITORING

  prometheus:
    image: prom/prometheus:main
    restart: on-failure
    networks:
      - monitoring-network
      - backend-network
      - db-network
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml

  grafana:
    image: grafana/grafana:12.2.0-ubuntu
    restart: on-failure
    ports:
      - "3000:3000"
    networks:
      - monitoring-network
    volumes:
      - grafana:/var/lib/grafana

volumes:
  postgresql:
  pgadmin:
  minio:
  rabbitmq:
  grafana:

networks:
  backend-network:
  db-network:
  monitoring-network: