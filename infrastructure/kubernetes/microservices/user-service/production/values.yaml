image:
  repository: acrdevopsprojectprodu.azurecr.io/user-service
  tag: &imageTag "v1.0"

namespace: prod

env:
  SERVER_PORT: "8080"
  RABBITMQ_HOST: rabbitmq.rabbitmq-system.svc.cluster.local

secretEnv:
  - name: POSTGRESQL_URI
    secretName: postgresql-credentials
    key: uri
  - name: POSTGRESQL_USERNAME
    secretName: postgresql-credentials
    key: username
  - name: POSTGRESQL_PASSWORD
    secretName: postgresql-credentials
    key: password

virtualService:
  enabled: true
  host: devops-production.kacperklimas.com
  gateway: istio-ingress/application-gateway
  uriPrefix: /api/user
  weights:
    v1: 100

destinationRule:
  enabled: true
  loadBalancer: LEAST_REQUEST
  subsets:
    - name: v1
      version: *imageTag