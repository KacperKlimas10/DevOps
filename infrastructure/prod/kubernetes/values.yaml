global:
  domain: devops.kacperklimas.com # We need to set domain for correct proxying
configs:
  cm:
    statusbadge.enabled: true # -- Enable Status Badge
server:   # We need to apply additional config to ArgoCD helm chart to proxy traffic via Istio gateway
  extraArgs:
    - --staticassets
    - /shared/app
    - --redis
    - argo-cd-argocd-redis:6379
    - --insecure
    - --basehref
    - /argocd
    - --rootpath
    - /argocd
  env:
    - name: ARGOCD_MAX_CONCURRENT_LOGIN_REQUESTS_COUNT
      value: "0"