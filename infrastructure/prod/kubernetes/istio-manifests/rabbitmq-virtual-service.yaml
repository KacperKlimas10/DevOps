apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rabbitmq-http-virtualservice
  namespace: rabbitmq-system
spec:
  hosts:
    - devops.kacperklimas.com
  gateways:
    - istio-ingress/application-gateway # In the virtual service documentation we can find information how to reference to gateway in other ns
  http:
    - match:
        - uri:
            prefix: /rabbitmq
      route:
        - destination:
            host: devops-project-cluster.rabbitmq-system.svc.cluster.local
            port:
              number: 15672
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rabbitmq-tcp-virtualservice
  namespace: rabbitmq-system
spec:
  hosts:
    - rabbitmq.rabbitmq-system.svc.cluster.local
  tcp:
    - match:
        - port: 5672  # TCP AMQP
      route:
        - destination:
            host: devops-project-cluster.rabbitmq-system.svc.cluster.local
            port:
              number: 5672
    - match:
        - port: 4369  # TCP EPMD
      route:
        - destination:
            host: devops-project-cluster-nodes.rabbitmq-system.svc.cluster.local
            port:
              number: 4369
    - match:
        - port: 15692  # TCP Prometheus port
      route:
        - destination:
            host: devops-project-cluster.rabbitmq-system.svc.cluster.local
            port:
              number: 15692