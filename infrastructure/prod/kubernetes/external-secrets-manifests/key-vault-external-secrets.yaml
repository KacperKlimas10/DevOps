apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-cluster-secret-store
  refreshPolicy: Periodic
  refreshInterval: 0h5m0s
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner # Creates Kubernetes secret if ExternalSecret created
  data:
    - secretKey: api-token
      remoteRef:
        key: secret/cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-cluster-secret-store
  refreshPolicy: Periodic
  refreshInterval: 0h5m0s
  target:
    name: cloudflare-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: secret/cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azurecr-credentials
  namespace: prod
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-cluster-secret-store
  refreshPolicy: Periodic
  refreshInterval: 0h5m0s
  target:
    name: azurecr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: | # Token username is the same as ACR name
          {
            "auths": {
              "{{ .token }}.azurecr.io": {
                "username": "{{ .token }}",
                "password": "{{ .password }}"
              }
            }
          }
  data:
    - secretKey: token
      remoteRef:
        key: secret/aks-acr-token
    - secretKey: password
      remoteRef:
        key: secret/aks-acr-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: prod
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-cluster-secret-store
  refreshPolicy: Periodic
  refreshInterval: 0h5m0s
  target:
    name: postgresql-credentials
    creationPolicy: Owner
    template:
      data: # Complete URI for JDBC with TLS required
        postgresql:
          uri: jdbc:postgresql://{{ .uri }}/devops?&sslmode=require
          username: {{ .username }}
          password: {{ .password }}
  data:
    - secretKey: uri
      remoteRef:
        key: secret/postgresql-uri
    - secretKey: username
      remoteRef:
        key: secret/postgresql-username
    - secretKey: password
      remoteRef:
        key: secret/postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-r2-credentials
  namespace: prod
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-cluster-secret-store
  refreshPolicy: Periodic
  refreshInterval: 0h5m0s
  target:
    name: cloudflare-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: apiUri
      remoteRef:
        key: secret/cloudflare-r2-api-uri
    - secretKey: accessKeyId
      remoteRef:
        key: secret/cloudflare-r2-account-id
    - secretKey: secretAccessKey
      remoteRef:
        key: secret/cloudflare-api-token