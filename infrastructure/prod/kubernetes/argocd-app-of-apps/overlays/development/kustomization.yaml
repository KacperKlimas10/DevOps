apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: storage-service
      namespace: argocd
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: storage-service
      spec:
        targetRevision: feature/argocd-testing
        path: infrastructure/prod/kubernetes/storage-service-manifests/overlays/development
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: user-service
      namespace: argocd
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: user-service      
      spec:
        targetRevision: feature/argocd-testing
        path: infrastructure/prod/kubernetes/user-service-manifests/overlays/development
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: config-external-secrets
      namespace: argocd
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: config-external-secrets     
      spec:
        targetRevision: feature/argocd-testing
        path: infrastructure/prod/kubernetes/external-secrets-manifests/overlays/development
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: config-config-istio
      namespace: argocd
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      metadata:
        name: config-config-istio
      kind: Application
      spec:
        targetRevision: feature/argocd-testing
        path: infrastructure/prod/kubernetes/istio-manifests/overlays/development