asyncapi: "3.0.0"
info:
  title: File Storage Events
  version: "1.0.0"
  description: Async events published by the file-storage-service

channels:
  file.uploaded:
    address: "storage.events/file.uploaded"
    description: Published when a file upload slot has been created and signed URLs are ready
    messages:
      FileUploadedEvent:
        $ref: "#/components/messages/FileUploadedEvent"

operations:
  publishFileUploaded:
    action: send
    channel:
      $ref: "#/channels/file.uploaded"
    messages:
      - $ref: "#/components/messages/FileUploadedEvent"

components:
  messages:
    FileUploadedEvent:
      name: FileUploadedEvent
      title: File Uploaded Event
      summary: Emitted when a presigned upload/download URL pair has been generated for a file
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FileUploadedEvent"

  schemas:
    FileUploadedEvent:
      type: object
      required:
        - eventUUID
        - occurredAt
        - eventType
        - schemaVersion
        - fileUUID
        - fileName
        - putSignedUrl
        - getSignedUrl
      properties:
        # Metadata
        eventUUID:
          type: string
          format: uuid
          description: Unique identifier of this event instance
        occurredAt:
          type: string
          format: date-time
          description: UTC timestamp when the event was created (ISO 8601)
        eventType:
          type: string
          enum: ["file.uploaded"]
          description: Discriminator field identifying the event type
        schemaVersion:
          type: integer
          example: 1
          description: Schema version — increment on breaking changes
        correlationId:
          type: string
          format: uuid
          description: Optional ID linking related events across services for tracing
        # Payload
        fileUUID:
          type: string
          format: uuid
          description: Unique identifier of the uploaded file
        fileName:
          type: string
          description: Original name of the file
        putSignedUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the file content (PUT)
        getSignedUrl:
          type: string
          format: uri
          description: Presigned URL for downloading the file content (GET)