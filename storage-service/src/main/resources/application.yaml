spring:
  application:
    name: "storage-service"
  cloud:
    aws:
      credentials:
        access-key: "${BUCKET_ACCESS_KEY}:kacperkacper"
        secret-key: "${BUCKET_SECRET_KEY}:kacperkacper"
      s3:
        endpoint: "${BUCKET_ENDPOINT:http://localhost:9000}"
        region: "${BUCKET_REGION}:us-east-1" # Auto region for Minio and R2
  rabbitmq:
    username: "${RABBITMQ_USERNAME:kacper}"
    password: "${RABBITMQ_PASSWORD:kacper}"
    virtual-host: "${RABBITMQ_VHOST:rabbitmq}"
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    template:
      retry:
        enabled: true
        initial-interval: 2s
management:
  endpoint:
    health:
      probes:
        enabled: true   # Kubernetes readiness and liveness probes
        add-additional-paths: true
  endpoints:  # Metrics for Prometheus
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"
logging:
  level:
    root: INFO
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit: DEBUG
    org.springframework.amqp.rabbit.connection: DEBUG
    org.springframework.amqp.rabbit.listener: DEBUG
    com.rabbitmq.client: DEBUG
server:
  port: "${SERVER_PORT:8500}"