spring:
  application:
    name: "storage-service"
  cloud:
    aws:
      s3:
        endpoint: "${BUCKET_ENDPOINT:http://localhost:9000}"
        region: "us-east-1" # Auto region for Minio and R2
  rabbitmq:
    username: "${RABBITMQ_USERNAME:kacper}"
    password: "${RABBITMQ_PASSWORD:kacper}"
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    virtual-host: "${RABBITMQ_VHOST:rabbitmq}"
    template:
      retry:
        enabled: true
        initial-interval: 2s
management:
  endpoint:
    health:
      probes:
        enabled: true   # Kubernetes readiness and liveness probes
        add-additional-paths: true
  endpoints:  # Metrics for Prometheus
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"
server:
  port: "${SERVER_PORT:8500}"